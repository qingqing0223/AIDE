name: AIDE v2 static checks

on:
  push:
    branches:
      - rebuild/aide-full-pipeline-v2
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Parse all Python sources
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = list(Path("repro_v2/aide_repro").glob("*.py")) + list(Path("repro_v2/tests").glob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"AST syntax check passed for {len(files)} Python files")
          PY
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("repro_v2/configs").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("JSON configuration checks passed")
          PY

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU PyTorch test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.1.0+cpu torchaudio==2.1.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 soundfile pytest
      - name: Run unit tests
        working-directory: repro_v2
        env:
          PYTHONPATH: .
        run: python -m pytest -q
